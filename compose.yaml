services:
  coned-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: coned-scraper:local
    container_name: coned-scraper
    restart: unless-stopped
    init: true
    environment:
      CONED_DATA_PATH: /app/data
      CONED_SOURCE_MODE: ${CONED_SOURCE_MODE:-auto}
      CONED_POLLING_INTERVAL_MINUTES: ${CONED_POLLING_INTERVAL_MINUTES:-7.5}
      CONED_DAILY_LOOKBACK_DAYS: ${CONED_DAILY_LOOKBACK_DAYS:-30}
      CONED_ACCOUNT_OVERRIDE: ${CONED_ACCOUNT_OVERRIDE:-}
      CONED_USERNAME: ${CONED_USERNAME:-}
      CONED_EMAIL: ${CONED_EMAIL:-}
      CONED_PASSWORD: ${CONED_PASSWORD:-}
      CONED_PASSWORD_ENCODING: ${CONED_PASSWORD_ENCODING:-}
      CONED_TOTP_SECRET: ${CONED_TOTP_SECRET:-}
      TOTP_SECRET: ${TOTP_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - coned-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

volumes:
  coned-data:
